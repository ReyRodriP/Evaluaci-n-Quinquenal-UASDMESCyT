services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-evaluacion_quinquenal}
      POSTGRES_USER: ${DB_USER:-evaluacion_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-evaluacion_pass}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-evaluacion_user} -d ${DB_NAME:-evaluacion_quinquenal}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_quinquenal}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD:-redis_quinquenal}' ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    # Imagen prebuilt en GitHub Container Registry (publicada por CI al hacer
    # push a main). Si no esta disponible, `docker compose up` la construye
    # localmente desde ./backend porque tambien esta declarado `build:`.
    # Para forzar el build local despues de un pull: docker compose build backend
    image: ${IMAGE_BACKEND:-ghcr.io/reyrodrip/evaluacion-n-quinquenal-uasdmescyt/backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DJANGO_SETTINGS_MODULE=evaluacionQuinquenal.settings
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-cambiar-esta-clave-en-produccion}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-evaluacion_quinquenal}
      - DB_USER=${DB_USER:-evaluacion_user}
      - DB_PASSWORD=${DB_PASSWORD:-evaluacion_pass}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_quinquenal}@redis:6379/1
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:4200}
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-noreply@localhost}
      - NOTIFICACIONES_EMAIL_ENABLED=${NOTIFICACIONES_EMAIL_ENABLED:-False}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - MEDIA_ROOT=/app/media
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-False}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-False}
      - CSRF_COOKIE_SECURE=${CSRF_COOKIE_SECURE:-False}
      - SECURE_HSTS_SECONDS=${SECURE_HSTS_SECONDS:-0}
      # Credenciales del superusuario de desarrollo (las usa setup-todo.ps1).
      - SUPERUSER_USERNAME=${SUPERUSER_USERNAME:-admin}
      - SUPERUSER_EMAIL=${SUPERUSER_EMAIL:-admin@uased.local}
    volumes:
      - media_data:/app/media
      - logs_data:/app/logs

  frontend:
    # Mismo criterio que backend: pull desde GHCR, build local como fallback.
    image: ${IMAGE_FRONTEND:-ghcr.io/reyrodrip/evaluacion-n-quinquenal-uasdmescyt/frontend:latest}
    build:
      context: ./frontend/evaluacion-quinquenal-front
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  media_data:
  logs_data:

version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-evaluacion_quinquenal}
      POSTGRES_USER: ${DB_USER:-evaluacion_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-evaluacion_pass}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-evaluacion_user} -d ${DB_NAME:-evaluacion_quinquenal}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DJANGO_SETTINGS_MODULE=evaluacionQuinquenal.settings
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-change-me-in-production}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-evaluacion_quinquenal}
      - DB_USER=${DB_USER:-evaluacion_user}
      - DB_PASSWORD=${DB_PASSWORD:-evaluacion_pass}
      - DB_HOST=db
      - DB_PORT=5432
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - MEDIA_ROOT=/app/media
    volumes:
      - media_data:/app/media

  frontend:
    build:
      context: ./frontend/evaluacion-quinquenal-front
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  media_data:

<div class="pagination" *ngIf="total > 0">
  <span>
    Mostrando {{ from }}-{{ to }} de {{ total }} registros
  </span>

  <div class="pages">
    <button (click)="goTo(currentPage - 1)" [class.disabled]="currentPage === 1">◀</button>
    <button
      *ngFor="let p of pages"
      (click)="goTo(p)"
      [class.current]="p === currentPage"
    >{{ p }}</button>
    <button (click)="goTo(currentPage + 1)" [class.disabled]="currentPage === totalPages">▶</button>
  </div>
</div>

<aside class="barra-lateral">
  <nav class="sidebar" [class.close]="!open" role="navigation" aria-label="Menú principal">
    <div class="user-details">
        <div class="image-text">
            <span class="image">
                <a routerLink="/perfil" aria-label="Mi perfil">
                    <img [src]="currentUser?.foto_perfil || 'img/noUser.png'" alt="Foto de perfil">
                </a>
            </span>
        </div>

        <div class="text sidebar-text">
            <span class="name">Bienvenido</span>
            <span class="slogan">{{ currentUser?.username || 'Usuario' }}</span>
        </div>
    </div>

    <i
      class='bx bx-caret-right toggle'
      (click)="toggleSidebar()"
      [attr.role]="'button'"
      [attr.aria-label]="open ? 'Contraer menú' : 'Expandir menú'"
      tabindex="0"
      (keydown.enter)="toggleSidebar()"
      (keydown.space)="toggleSidebar()"></i>

    <div class="menu-bar">
        <div class="menu">
            <ul class="menu-links">
                <li class="nav-link" *ngFor="let item of menuItems">
                    <a [routerLink]="item.path" [attr.aria-label]="item.label">
                        <i class='bx {{ item.icon }} icon' aria-hidden="true"></i>
                        <span class="text nav-text">{{ item.label }}</span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="botton-content">
             <li class="nav-link">
                    <a href="#" (click)="onLogout(); $event.preventDefault()" aria-label="Cerrar sesión">
                        <i class='bx  bx-arrow-out-left-square-half icon' aria-hidden="true"></i>
                        <span class="text nav-text">Cerrar sesión</span>
                    </a>
            </li>
             <li class="mode">
                    <div class="moon-sun" role="img" aria-label="Cambiar tema claro u oscuro">
                        <i class="bx bx-moon icon moon" aria-hidden="true"></i>
                        <i class="bx bx-sun icon sun" aria-hidden="true"></i>
                    </div>
                    <span class="mode-text text">Modo oscuro</span>

                    <div class="toggle-switch">
                        <button
                          class="switch"
                          (click)="toggleTheme()"
                          [attr.role]="'switch'"
                          [attr.aria-label]="'Alternar modo oscuro'"
                          [attr.aria-checked]="darkMode"></button>
                    </div>
            </li>
        </div>
    </div>
</nav>
</aside>

<div class="profile-container">
  <div class="profile-header">
    <h2>Mi Perfil</h2>
    <p>Administra la información de tu cuenta.</p>
  </div>

  <div class="profile-card">
    <div class="profile-photo">
      <img [src]="getPhotoUrl()" alt="Foto de perfil">

      <label class="change-photo" for="photoInput">
        <i class="bx bx-camera"></i>
        Cambiar foto
      </label>
      <input id="photoInput" type="file" accept="image/*" hidden (change)="onPhotoSelected($event)" />
    </div>

    <div class="profile-form">
      <section>
        <h3>Información de la cuenta</h3>

        <div class="form-group">
          <label for="perfil_username">Nombre de usuario</label>
          <input id="perfil_username" type="text" [(ngModel)]="user.username" name="username" placeholder="Nombre de usuario">
        </div>

        <div class="form-group">
          <label for="perfil_email">Correo electrónico</label>
          <input id="perfil_email" type="email" [(ngModel)]="user.email" name="email" autocomplete="email" placeholder="correo@uasd.edu.do">
        </div>

        <div class="password-row">
          <div class="form-group">
            <label for="perfil_password">Contraseña</label>
            <input id="perfil_password" type="password" name="password" value="************" disabled>
          </div>

          <button class="btn-change-password" type="button" (click)="togglePasswordFields()">
            {{ showPasswordFields ? 'Cancelar' : 'Cambiar' }}
          </button>
        </div>

        <div *ngIf="showPasswordFields" class="password-fields">
          <div class="form-group">
            <label for="old_password">Contraseña actual</label>
            <input id="old_password" type="password" name="old_password" [(ngModel)]="passwordPayload.old_password" autocomplete="current-password" placeholder="Contraseña actual">
          </div>

          <div class="form-group">
            <label for="new_password">Nueva contraseña</label>
            <input id="new_password" type="password" name="new_password" [(ngModel)]="passwordPayload.new_password" autocomplete="new-password" placeholder="Nueva contraseña">
          </div>

          <button class="btn-save btn-password" type="button" (click)="changePassword()">
            Guardar contraseña
          </button>
        </div>
      </section>

      <section>
        <h3>Información personal</h3>

        <div class="grid-2">
          <div class="form-group">
            <label for="perfil_first_name">Nombre</label>
            <input id="perfil_first_name" type="text" [(ngModel)]="user.first_name" name="first_name" autocomplete="given-name" placeholder="Nombre">
          </div>

          <div class="form-group">
            <label for="perfil_last_name">Apellido</label>
            <input id="perfil_last_name" type="text" [(ngModel)]="user.last_name" name="last_name" autocomplete="family-name" placeholder="Apellido">
          </div>
        </div>

        <div class="form-group">
          <label for="perfil_telefono">Número telefónico</label>
          <input id="perfil_telefono" type="tel" [(ngModel)]="user.telefono" name="telefono" autocomplete="tel" placeholder="(809) 000-0000">
        </div>
      </section>

      <div class="profile-actions">
        <button class="btn-cancel" type="button" (click)="goBack()">Volver</button>
        <button class="btn-save" type="button" (click)="onSubmit()" [disabled]="loading">
          {{ loading ? 'Guardando...' : 'Guardar cambios' }}
        </button>
      </div>
    </div>
  </div>
</div>

<section class="evidencias-page">
  <div *ngIf="loading" class="state-message">Cargando asignaciones...</div>

  <ng-container *ngIf="!loading">
    <app-search-bar
      [titulo]="'Evidencias'"
      [placeholder]="'Buscar por indicador, unidad, estado...'"
      [stateOptions]="[]"
      [showCreate]="false"
      [showState]="false"
      [pageSize]="pageSize"
      (search)="onSearch($event)"
      (pageSizeChange)="onPageSizeChange($event)">
      <div class="period-selector">
        <label for="evidencias-periodo">Período</label>
        <select id="evidencias-periodo" [ngModel]="periodoSeleccionadoId" (ngModelChange)="onPeriodoChange($event)">
          <option *ngIf="!periodoSeleccionadoId" value="">Sin período activo</option>
          <option *ngFor="let periodo of periodos" [value]="periodo.id">
            {{ periodo.nombre }} · {{ periodo.activo ? 'Activo' : 'Finalizado' }}
          </option>
        </select>
        <span *ngIf="periodoSeleccionadoId && !periodoSeleccionadoEsActivo">Solo consulta histórica</span>
      </div>
    </app-search-bar>

    <div class="bulk-download-bar" *ngIf="puedeDescargarMasivo">
      <button type="button" class="select-page-btn" (click)="alternarSeleccionPagina()" [disabled]="!seleccionablesPagina.length">
        {{ paginaCompletaSeleccionada ? 'Quitar selección de esta página' : 'Seleccionar esta página' }}
      </button>
      <span class="selection-count">
        {{ seleccionadas.size }} evidencias seleccionadas · máximo {{ limiteDescargaMasiva }} por ZIP
      </span>
      <button type="button" class="bulk-download-btn" (click)="descargarSeleccionadas()"
        [disabled]="!seleccionadas.size || seleccionadas.size > limiteDescargaMasiva || descargandoMasivo">
        <i class="bx bx-download" aria-hidden="true"></i>
        {{ descargandoMasivo ? 'Preparando ZIP...' : 'Descargar seleccionadas' }}
      </button>
    </div>

    <app-crud-table
      [columnas]="['Selección', 'Unidad responsable', 'Indicador', 'Período', 'Estado', 'Archivo', 'Observaciones']"
      [datos]="rowsPaginados"
      [plantillasCelda]="{ 'Selección': plantillaSeleccion }"
      [ocultarAcciones]="['edit', 'toggle', 'remove']">
      <ng-template #plantillaSeleccion let-row>
        <input class="evidence-select-checkbox" type="checkbox" [checked]="filaSeleccionada(row)" [disabled]="!row.evidenciaId || !puedeDescargarMasivo"
          [attr.aria-label]="'Seleccionar evidencia ' + row.indicador_nombre"
          (change)="cambiarSeleccionFila(row, $event)" />
      </ng-template>
      <ng-template #acciones let-row>
        <div class="action-group">
          <button *ngIf="!row.evidenciaId && puedeSubir" type="button" class="action-btn action-primary" (click)="openManage(row)">
            Subir evidencia
          </button>
          <button *ngIf="row.evidenciaId" type="button" class="action-btn action-secondary" (click)="openManage(row)">
            Ver detalle
          </button>
          <button *ngIf="row.evidenciaId" type="button" class="action-btn action-secondary" (click)="descargarUltimoArchivo(row)">
            Descargar
          </button>
          <button *ngIf="row.evidenciaId" type="button" class="action-btn action-secondary" (click)="verHistorial(row)">
            Ver historial
          </button>
          <button *ngIf="row.evidenciaId && row.evidencia?.estado !== 'cancelada' && puedeCancelarReactivar" type="button" class="action-btn action-danger" (click)="cancelar(row)">
            Cancelar
          </button>
          <button *ngIf="row.evidenciaId && row.evidencia?.estado === 'cancelada' && puedeCancelarReactivar" type="button" class="action-btn action-secondary" (click)="reactivar(row)">
            Reactivar
          </button>
        </div>
      </ng-template>
    </app-crud-table>

    <app-pagination
      [total]="rowsFiltrados.length"
      [pageSize]="pageSize"
      [currentPage]="currentPage"
      (pageChange)="onPageChange($event)">
    </app-pagination>

    <div *ngIf="!periodoSeleccionadoId && !loading" class="state-message">No hay un período activo para gestionar evidencias.</div>
    <div *ngIf="periodoSeleccionadoId && !rowsFiltrados.length && !loading" class="state-message">No hay asignaciones para el período seleccionado.</div>
  </ng-container>

  <app-modal
    [open]="historialAbierto"
    [data]="historialData"
    [title]="'Historial'"
    [editTitle]="'Historial de versiones'"
    [fields]="historialCampos"
    (close)="cerrarHistorial()"
    (save)="cerrarHistorial()">
  </app-modal>
</section>

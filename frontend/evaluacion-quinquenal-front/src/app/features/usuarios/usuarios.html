<div class="crud-container">
  <div class="crud-header">
    <app-search-bar
      [titulo]="'Usuarios'"
      [placeholder]="'Buscar por nombre, correo o rol'"
      [stateOptions]="['Todos', 'Activos', 'Inactivos']"
      [showCreate]="puedeCrear"
      [pageSize]="pageSize"
      (create)="openNew()"
      (search)="onSearch($event)"
      (stateChange)="onStateChange($event)"
      (pageSizeChange)="onPageSizeChange($event)">
    </app-search-bar>
  </div>

  <app-crud-table
    [columnas]="columnas"
    [datos]="datosPaginados"
    [ocultarAcciones]="ocultarAcciones"
    (edit)="openEdit($event)"
    (remove)="onRemove($event)"
    (toggleEstado)="onToggleEstado($event)">
  </app-crud-table>

  <app-pagination
    [total]="datosFiltrados.length"
    [pageSize]="pageSize"
    [currentPage]="currentPage"
    (pageChange)="onPageChange($event)">
  </app-pagination>

  <app-modal
    [open]="showModal"
    [data]="selectedItem"
    [title]="'Usuario'"
    [newTitle]="'Nuevo Usuario'"
    [editTitle]="'Editar Usuario'"
    [fields]="usuarioFields"
    (close)="onModalClose()"
    (save)="onModalSave($event)">
  </app-modal>
</div>

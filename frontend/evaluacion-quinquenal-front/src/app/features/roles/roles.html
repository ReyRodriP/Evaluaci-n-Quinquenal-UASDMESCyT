<div class="crud-container">
  <app-search-bar
    [titulo]="'Roles'"
    [placeholder]="'Buscar roles o permisos...'"
    [stateOptions]="[]"
    [showCreate]="false"
    (search)="onSearch($event)">
  </app-search-bar>

  <app-crud-table
    [columnas]="columnas"
    [datos]="rolesFiltrados"
    [ocultarAcciones]="['edit', 'toggle', 'remove']"
    [plantillasCelda]="{ Permisos: permisosTemplate }">
  </app-crud-table>

  <ng-template #permisosTemplate let-role>
    <div class="permisos-cell">
      <span class="permisos-text" [class.expanded]="expandidos.has(role.id)">
        {{ role.permisos }}
      </span>
      <button *ngIf="role.permisoCount > 3" type="button" class="ver-mas-btn" (click)="toggleExpandir(role.id)">
        {{ expandidos.has(role.id) ? 'Ver menos' : 'Ver más (' + (role.permisoCount - 3) + ')' }}
      </button>
    </div>
  </ng-template>

  <app-modal
    [open]="showModal"
    [data]="selectedItem"
    [title]="'Rol'"
    [editTitle]="'Editar permisos'"
    [fields]="roleFields"
    (close)="onModalClose()"
    (save)="onModalSave($event)">
  </app-modal>
</div>

<div class="login-container">

    <img src="img/UASD-Logo.png" alt="Logo UASD" class="login-logo">

    <h1>Recuperar Contraseña</h1>

    <p class="subtitle">
        Ingresa tu correo electrónico para recibir instrucciones
    </p>

    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">

        <div class="input-group">
            <i class='bx bx-envelope'></i>
            <label for="forgot_email" class="sr-only">Correo electrónico</label>
            <input id="forgot_email" name="email" type="email" autocomplete="email" placeholder="Correo electrónico" formControlName="email" required>
        </div>

        <button type="submit" class="btn-login" [disabled]="forgotForm.invalid">
            Enviar Instrucciones
        </button>

    </form>

    <div class="register-link">
        <p><a routerLink="/auth/login">Volver al inicio de sesión</a></p>
    </div>

</div>

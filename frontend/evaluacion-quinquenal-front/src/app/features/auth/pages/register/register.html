<div class="register-container">

    <section class="register-info">
        <img src="/img/UASD-Logo.png" alt="Logo UASD">
        <h2>Universidad Autónoma de Santo Domingo</h2>

        <img src="/img/Logo_MESCyT_(RD).png" alt="Logo MESCyT" style="width: 200px; margin: 0;">
        <h3>MESCyT</h3>

        <p>
            Sistema de Gestión de Evidencias para la Evaluación Quinquenal Institucional.
        </p>
    </section>

    <section class="register-form">

        <h1>Registro</h1>

        <form action="POST" [formGroup]="registerForm" (ngSubmit)="onSubmit()">

            <label for="username" class="sr-only">Nombre de usuario</label>
            <input type="text" name="username" id="username" autocomplete="username" placeholder="Nombre de usuario" formControlName="username" required />
            <!-- <small *ngIf="registerForm.get('username')?.touched && registerForm.get('username')?.hasError('required')">Nombre de usuario requerido</small> -->

            <label for="email" class="sr-only">Correo electrónico</label>
            <input type="email" name="email" id="email" autocomplete="email" placeholder="Correo electrónico" formControlName="email" required />
            <!-- <small>Correo requerido</small> -->

            <div class="form-row">
                <label for="first_name" class="sr-only">Nombre</label>
                <input type="text" name="first_name" id="first_name" autocomplete="given-name" placeholder="Nombre" formControlName="first_name" required />
                <!-- <small>Nombre requerido</small> -->

                <label for="last_name" class="sr-only">Apellido</label>
                <input type="text" name="last_name" id="last_name" autocomplete="family-name" placeholder="Apellido" formControlName="last_name" required />
                <!-- <small>Apellido requerido</small> -->
            </div>

            <label for="telefono" class="sr-only">Teléfono</label>
            <input type="tel" name="telefono" id="telefono" autocomplete="tel" placeholder="Teléfono" formControlName="telefono" required />

            <label for="password" class="sr-only">Contraseña</label>
            <input type="password" name="password" id="password" autocomplete="new-password" placeholder="Contraseña" formControlName="password" required />

            <label for="passwordConfirmation" class="sr-only">Confirmar contraseña</label>
            <input type="password" name="passwordConfirmation" id="passwordConfirmation" autocomplete="new-password" placeholder="Confirmar contraseña" formControlName="passwordConfirmation" required />

            <button type="submit" class="btn-register" [disabled]="registerForm.invalid">Registrarse</button>

        </form>

        <div class="login-link">
            <p>¿Tienes un usuario creado?</p>
            <a routerLink="/auth/login">
                Iniciar Sesión
            </a>
        </div>
    </section>

</div>

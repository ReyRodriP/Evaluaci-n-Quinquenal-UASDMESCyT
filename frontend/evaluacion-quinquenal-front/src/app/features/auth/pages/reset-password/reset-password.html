<div class="login-container">

    <img src="img/UASD-Logo.png" alt="Logo UASD" class="login-logo">

    <h1>Nueva Contraseña</h1>

    <p class="subtitle">
        Ingresa tu nueva contraseña
    </p>

    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">

        <div class="input-group">
            <i class='bx bx-lock-alt'></i>
            <input type="password" placeholder="Nueva contraseña" formControlName="new_password" required minlength="6">
        </div>

        <div class="input-group">
            <i class='bx bx-lock-alt'></i>
            <input type="password" placeholder="Confirmar contraseña" formControlName="confirm_password" required minlength="6">
        </div>

        <button type="submit" class="btn-login" [disabled]="resetForm.invalid">
            Restablecer Contraseña
        </button>

    </form>

    <div class="register-link">
        <p><a routerLink="/auth/login">Volver al inicio de sesión</a></p>
    </div>

</div>

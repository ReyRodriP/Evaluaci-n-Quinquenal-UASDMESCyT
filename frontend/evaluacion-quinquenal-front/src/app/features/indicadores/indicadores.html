<div class="crud-container">
  <div class="crud-header">
    <app-search-bar [titulo]="'Indicadores'" [placeholder]="'Buscar por nombre'" [stateOptions]="['Todas', 'Activos', 'Inactivos']" [showCreate]="puedeCrear" [pageSize]="pageSize" (create)="openNew()" (search)="onSearch($event)" (stateChange)="onStateChange($event)" (pageSizeChange)="onPageSizeChange($event)"></app-search-bar>
    <app-crud-table [columnas]="columnas" [datos]="datosPaginados" [ocultarAcciones]="ocultarAcciones" [plantillasCelda]="{ 'Vínculos': plantillaVinculos }" (edit)="openEdit($event)" (remove)="onRemove($event)" (toggleEstado)="onToggleEstado($event)">
      <ng-template #plantillaVinculos let-row>
        <a class="vinculos-link" [routerLink]="['/indicadores', row.id, 'detalle']">Ver vínculos</a>
      </ng-template>
    </app-crud-table>
    <app-pagination [total]="datosFiltrados.length" [pageSize]="pageSize" [currentPage]="currentPage" (pageChange)="onPageChange($event)"></app-pagination>

    <app-modal
      [open]="showModal"
      [data]="selectedItem"
      [title]="'Indicador'"
      [newTitle]="'Nuevo Indicador'"
      [editTitle]="'Editar Indicador'"
      [fields]="indicadorFields"
      (close)="onModalClose()"
      (save)="onModalSave($event)">
    </app-modal>
  </div>
</div>

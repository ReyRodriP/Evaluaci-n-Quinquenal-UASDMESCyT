<div class="crud-container">
  <div class="crud-header">
    <app-search-bar [titulo]="'Asignaciones'" [placeholder]="'Buscar por nombre'" [stateOptions]="['Todos', 'Pendiente', 'En progreso', 'Completado', 'Aprobado', 'Rechazado']" [stateLabel]="'Estado de asignación'" [showCreate]="puedeCrear" [pageSize]="pageSize" (create)="openNew()" (search)="onSearch($event)" (stateChange)="onStateChange($event)" (pageSizeChange)="onPageSizeChange($event)">
      <div class="period-selector">
        <label for="asignaciones-periodo">Período</label>
        <select id="asignaciones-periodo" [ngModel]="periodoSeleccionadoId" (ngModelChange)="onPeriodoChange($event)">
          <option *ngIf="!periodoSeleccionadoId" value="">Sin período activo</option>
          <option *ngFor="let periodo of periodos" [value]="periodo.id">
            {{ periodo.nombre }} · {{ periodo.activo ? 'Activo' : 'Finalizado' }}
          </option>
        </select>
        <span *ngIf="periodoSeleccionadoId && !periodoSeleccionadoEsActivo">Solo consulta histórica</span>
      </div>
    </app-search-bar>
    <app-crud-table [columnas]="columnas" [datos]="datosPaginados" [ocultarAcciones]="ocultarAcciones" [plantillasCelda]="{ 'Indicadores': plantillaIndicadores }" (edit)="openEdit($event)" (remove)="onRemove($event)">
      <ng-template #plantillaIndicadores let-row>
        <div class="indicadores-list">
          <a
            *ngFor="let asignacion of row.asignaciones; let i = index"
            class="indicador-link"
             [routerLink]="['/asignaciones', asignacion.id, 'detalle']" [queryParams]="{ periodo: periodoSeleccionadoId }">
             {{ row.indicadores[i]?.nombre || 'Indicador' }}
          </a>
         </div>
         <small *ngIf="row.tipo_origen === 'marco'">Indicador del marco · consulta en el detalle</small>
       </ng-template>
       <ng-template #acciones let-row>
         <a *ngIf="row.tipo_origen === 'marco'" [routerLink]="['/asignaciones', row.id, 'detalle']" [queryParams]="{ periodo: periodoSeleccionadoId }">Ver detalle</a>
         <button *ngIf="row.tipo_origen !== 'marco' && !ocultarAcciones.includes('edit')" type="button" (click)="openEdit(row)" aria-label="Editar asignación"><i class="bx bx-edit-alt"></i></button>
         <button *ngIf="!ocultarAcciones.includes('remove')" type="button" (click)="onRemove(row)" aria-label="Eliminar asignación"><i class="bx bx-trash"></i></button>
       </ng-template>
    </app-crud-table>
    <app-pagination [total]="datosFiltrados.length" [pageSize]="pageSize" [currentPage]="currentPage" (pageChange)="onPageChange($event)"></app-pagination>

    <app-modal
      [open]="showModal"
      [data]="selectedItem"
      [title]="'Asignación'"
      [newTitle]="'Nueva Asignación'"
      [editTitle]="'Editar Asignación'"
      [fields]="asignacionFields"
      (close)="onModalClose()"
      (save)="onModalSave($event)">
    </app-modal>
  </div>
</div>

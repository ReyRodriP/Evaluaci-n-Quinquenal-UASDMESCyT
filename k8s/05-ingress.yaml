apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: evaluacion-ingress
  namespace: evaluacion-quinquenal
  annotations:
    # Limite de subida para evidencias (Traefik de k3s no filtra el body, el backend lo valida)
    traefik.ingress.kubernetes.io/router.middlewares: ""
spec:
  ingressClassName: traefik
  rules:
    - host: localhost
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /media/
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

# PLANTILLA DE SECRETOS KUBERNETES
# =============================================================================
# COPIA este archivo a k8s/01-secrets.yaml (que está en .gitignore y NO se
# commitea) y rellena con secretos reales. Entrega CONFIGURACION en repositorio.
#
# Nota: los valores de ejemplo deben rotarse; los usados en cualquier
# despliegue real deben generarse por separado (SealedSecrets/ExternalSecrets).
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: evaluacion-quinquenal
type: Opaque
stringData:
  SECRET_KEY: "cambia-por-un-secret-key-largo-y-aleatorio"
  DJANGO_SUPERUSER_PASSWORD: "cambia-por-la-clave-del-superusuario"
  DB_PASSWORD: "cambia-por-la-clave-de-postgres"
  POSTGRES_PASSWORD: "cambia-por-la-clave-de-postgres"
  REDIS_PASSWORD: "cambia-por-la-clave-de-redis"
  BACKUP_PASSPHRASE: "cambia-por-la-frase-de-cifrado-de-backup"
  SENTRY_DSN: ""
  EMAIL_HOST_USER: ""
  EMAIL_HOST_PASSWORD: ""
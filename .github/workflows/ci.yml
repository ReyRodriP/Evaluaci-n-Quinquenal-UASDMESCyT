name: CI

on:
  push:
    branches: [main, Ramon_Paulino_Gil_100345706]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r backend/requirements.txt
      - run: ruff check backend/
      - run: python backend/manage.py check
      - run: python backend/manage.py test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd frontend/evaluacion-quinquenal-front && npm ci
      - run: cd frontend/evaluacion-quinquenal-front && npx ng build

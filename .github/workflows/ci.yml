name: CI/CD

on:
  push:
    branches: [main, Ramon_Paulino_Gil_100345706]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DEBUG: "True"
      SECRET_KEY: "ci-secret-key-solo-para-tests-no-usar-en-produccion"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r backend/requirements.txt
      - run: ruff check backend/
      - run: ruff format backend/ --check
      - run: python manage.py check
        working-directory: backend
      - run: python manage.py test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    env:
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd frontend/evaluacion-quinquenal-front && npm ci
      - run: cd frontend/evaluacion-quinquenal-front && npx ng test --watch=false --browsers=ChromeHeadless
      - run: cd frontend/evaluacion-quinquenal-front && npx ng build --configuration production

  docker:
    if: github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build y push imagen backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
      - name: Build y push imagen frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend/evaluacion-quinquenal-front
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}